[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autumn-job-assistant"
version = "0.1.0"
description = "面向单个求职者的 2027 届秋招助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "apscheduler==3.11.0",
  "argon2-cffi==25.1.0",
  "beautifulsoup4==4.13.5",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "lxml==6.0.1",
  "playwright==1.55.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "pymupdf==1.26.4",
  "python-multipart==0.0.20",
  "sentence-transformers==5.1.0",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

